<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="weather-container">
            <div class="temp">
                <p>21</p>
            </div>
            <div class="time_location">
                <p>Nairobi</p>
                <span>16:58</span>
            </div>
            <div class="condition">
                <p></p>
                <p></p>
            </div>
        </div>
        <nav>
            <form>
                <input type="text" placeholder="search location" class="search_area" />
                <button type="submit">Search </button>
            </form>
        </nav>
    </div>
    
    
</body>
<script src="script.js"></script>
</html>
